<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Offline-Prototyp</title><style>body{font:16px system-ui;max-width:760px;margin:3rem auto;padding:0 1rem;background:#f7faf9;color:#17332e}main{background:white;padding:2rem;border-radius:18px}button,textarea{font:inherit;padding:.7rem;margin:.3rem;width:90%}button{width:auto;background:#247b6d;color:white;border:0;border-radius:9px}</style><main><p>Technischer Prototyp · lokale Demo-Stunde</p><h1>Offline und Autosave</h1><textarea id="notes">Künstliche Demo-Stunde</textarea><button id="save">Lokal speichern</button><p id="status" aria-live="polite">synchronisiert</p></main><script type="module">import{OfflineDatabase,MemoryLessonServer,OfflineLessonService,demoLesson}from'./src/store.ts';const db=new OfflineDatabase('lehrerkompass-ui-demo');const server=new MemoryLessonServer();server.seed(demoLesson);if(!await db.lessons.get(demoLesson.id))await db.lessons.put(demoLesson);document.querySelector('#save').onclick=async()=>{const s=new OfflineLessonService(db,server);const l=await s.edit(demoLesson.id,{notes:document.querySelector('#notes').value});document.querySelector('#status').textContent=l.status}</script></html>
