<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Bibliothek-Prototyp</title><style>body{font:16px system-ui;max-width:760px;margin:3rem auto;padding:0 1rem;background:#f7faf9;color:#17332e}main{background:white;padding:2rem;border-radius:18px}button,input{font:inherit;padding:.7rem;margin:.3rem}button{background:#247b6d;color:white;border:0;border-radius:9px}li{margin:.6rem}</style><main><p>Technischer Prototyp · 10 künstliche Dateien</p><h1>Bibliotheksindex</h1><label>Suche <input id="query" value="Nomen Klasse 2"></label><button id="search">Suchen</button><ul id="results" aria-live="polite"></ul></main><script type="module">import{search}from'./src/library.ts';const run=()=>{const r=search(document.querySelector('#query').value);document.querySelector('#results').innerHTML=r.map(x=>`<li>${x.title} · ${x.indexStatus}</li>`).join('')||'<li>Keine Treffer</li>'};document.querySelector('#search').onclick=run;run()</script></html>
