<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OneDrive-Prototyp</title><style>body{font:16px system-ui;max-width:760px;margin:3rem auto;padding:0 1rem;background:#f7faf9;color:#17332e}main{background:white;padding:2rem;border-radius:18px}button,input{font:inherit;padding:.7rem;margin:.3rem}button{background:#247b6d;color:white;border:0;border-radius:9px}</style><main><p>Technischer Prototyp · ausschließlich Mock-Testordner</p><h1>OneDrive-Dateischutz</h1><label>Dateiname <input id="name" value="demo.txt"></label><button id="upload">In Testordner hochladen</button><pre id="result" aria-live="polite">Noch keine Testdatei.</pre></main><script type="module">import{InMemoryOneDriveAdapter}from'./src/mock-adapter.ts';const a=new InMemoryOneDriveAdapter();document.querySelector('#upload').onclick=async()=>{const i=await a.upload(a.testFolderId,document.querySelector('#name').value,'künstlicher Inhalt');document.querySelector('#result').textContent=JSON.stringify({driveId:i.driveId,itemId:i.itemId,name:i.name},null,2)}</script></html>
